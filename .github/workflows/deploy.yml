name: Deploy to hltv.relog.gg
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name "*.php" -not -path "./lib/PHPMailer/*" -print0 | xargs -0 -n1 php -l

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp handles FTPS data-channel TLS session reuse, which basic-ftp (FTP-Deploy-Action) trips over on this server.
      - name: Upload over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --parallel=3 --exclude ^\.git/ --exclude ^\.github/ --exclude-glob .git* --exclude ^\.htaccess$ --exclude ^README\.md$ --exclude ^config\.php$ --exclude ^storage/docs/ --exclude ^storage/mail\.log$ ./ ./
          bye
          EOF
