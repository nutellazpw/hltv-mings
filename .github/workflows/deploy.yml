name: Deploy to hltv.relog.gg
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name "*.php" -not -path "./lib/PHPMailer/*" -print0 | xargs -0 -n1 php -l

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/hltv.relog.gg/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .htaccess
            config.php
            storage/docs/**
            storage/mail.log
            storage/error.log
            README.md
